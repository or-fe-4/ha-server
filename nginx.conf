upstream backend {
    server web1:80 max_fails=1 fail_timeout=5s;
    server web2:80 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }
}upstream backend {
    server web1:80;
    server web2:80;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
    }
}
